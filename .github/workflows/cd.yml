name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # allow manual deploys from the Actions tab

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  NEXT_PUBLIC_SUPABASE_PROJECT_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_PROJECT_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  deploy:
    name: Build, push & deploy to Cloud Run
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for Workload Identity Federation

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0 # full history, so we can diff against the deployed SHA

      - id: auth
        name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - id: changes
        name: Check whether web/ changed since the deployed revision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying unconditionally."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOYED_IMAGE=$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format 'value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
          DEPLOYED_SHA="${DEPLOYED_IMAGE##*:}"

          if [ -z "${DEPLOYED_SHA}" ] || ! git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            echo "No usable deployed SHA ('${DEPLOYED_SHA}') to compare against — deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${DEPLOYED_SHA}" "${DEPLOY_SHA}" -- web; then
            echo "No web/ changes between ${DEPLOYED_SHA} and ${DEPLOY_SHA} — skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "web/ changed between ${DEPLOYED_SHA} and ${DEPLOY_SHA} — deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Docker for Artifact Registry
        if: steps.changes.outputs.deploy == 'true'
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        if: steps.changes.outputs.deploy == 'true'
        run: |
          IMAGE="${REGISTRY}/${GCP_PROJECT_ID}/${SERVICE_NAME}/${SERVICE_NAME}"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_PROJECT_URL="${NEXT_PUBLIC_SUPABASE_PROJECT_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            -t "${IMAGE}:${DEPLOY_SHA}" \
            -t "${IMAGE}:latest" \
            -f web/Dockerfile web
          docker push "${IMAGE}:${DEPLOY_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        if: steps.changes.outputs.deploy == 'true'
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGISTRY}/${GCP_PROJECT_ID}/${SERVICE_NAME}/${SERVICE_NAME}:${DEPLOY_SHA}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}"
